name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Clean Site
        run: |
          rm -rf _site
          bundle exec jekyll clean

      - name: Build site with Jekyll
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Remove junk files
        run: |
          find _site -name "*.map" -delete || true
          find _site -name "*.log" -delete || true
          find _site -name ".DS_Store" -delete || true
          find _site -type l -delete || true

      - name: Show generated site size
        run: |
          echo "=== SITE SIZE ==="
          du -sh _site

          echo "===== Top folders ====="
          du -h -d 2 _site | sort -hr | head -50

          echo ""
          echo "===== Largest files ====="
          find _site -type f -exec du -h {} + | sort -hr | head -50

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
