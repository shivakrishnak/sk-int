name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JEKYLL_ENV: production

    steps:
      # ==================================================
      # Checkout
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # Setup Ruby
      # ==================================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # ==================================================
      # Configure Pages
      # ==================================================
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # ==================================================
      # Clean build
      # ==================================================
      - name: Clean Site
        run: |
          rm -rf _site
          rm -rf .jekyll-cache
          rm -rf .sass-cache

          bundle exec jekyll clean

      # ==================================================
      # Build site
      # ==================================================
      - name: Build site with Jekyll
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"

      # ==================================================
      # Hard remove search assets
      # ==================================================
      - name: Remove Search Assets
        run: |
          rm -f _site/assets/js/search-data.json || true

      # ==================================================
      # Remove junk files
      # ==================================================
      - name: Remove junk files
        run: |
          find _site -name "*.map" -delete || true
          find _site -name "*.log" -delete || true
          find _site -name ".DS_Store" -delete || true
          find _site -type l -delete || true

      # ==================================================
      # Diagnostics
      # ==================================================
      - name: Analyze generated site
        run: |
          echo "=== SITE SIZE ==="
          du -sh _site

          echo ""
          echo "===== TOP FOLDERS ====="
          du -h -d 2 _site | sort -hr | head -50

          echo ""
          echo "===== LARGEST FILES ====="
          find _site -type f -exec du -h {} + \
            | sort -hr \
            | head -50

          echo ""
          echo "===== JS FILES ====="
          du -h _site/assets/js/* || true

          echo ""
          echo "===== SEARCH FILE ====="
          ls -lh _site/assets/js/search-data.json \
            || echo "search disabled"

      # ==================================================
      # Upload artifact
      # ==================================================
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
